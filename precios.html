<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de precios 2025</title>

    <style>
        body {
            background-color: LightBlue;
        }

        h1 {
            color: DarkBlue;
            text-align: center;
            border: 2px outset DarkBlue;
            border-radius: 10px;
        }

        table {
            width: 80%;
            border: 2px solid blue;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid blue;
        }

        tr:first-child {
            background-color: violet;
            color: white;
            text-align: center;
        }

        .cuna {
            background-color: violet;
            color: yellow;
        }
    </style>
</head>

<body>

    <h1>Lista de precios 2025</h1>

    <p>Actualizado a 20/05/2025</p>

    <table>

        <tr>
            <th>Habitación</th>
            <th>Temporada</th>
            <th>Precio</th>
        </tr>

        <tr>
            <td>Individual</td>
            <td>Alta</td>
            <td>40€</td>
        </tr>

        <tr>
            <td>Individual</td>
            <td>Baja</td>
            <td>25€</td>
        </tr>

        <tr>
            <td>Doble</td>
            <td>Alta</td>
            <td>60€</td>
        </tr>

        <tr>
            <td>Doble</td>
            <td>Baja</td>
            <td>50€</td>
        </tr>

        <tr>
            <td colspan="2" class="cuna">Suplemento cuna</td>
            <td>10€</td>
        </tr>

    </table>

    <p>
        <a href="index.html">Volver a principal</a>
    </p>

</body>
</html>
