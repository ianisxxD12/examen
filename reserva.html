<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Haga su reserva</title>

    <link rel="stylesheet" href="css/estilosformularios.css">
</head>

<body>

    <h1>Haga su reserva</h1>

    <form action="realizareserva.php" method="get">

        <fieldset>
            <legend>Datos Personales</legend>

            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre"
                       maxlength="30" required autofocus>
            </p>

            <p>
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos"
                       maxlength="50">
            </p>

            <p>
                <label for="dni">Dni:</label>
                <input type="text" id="dni" name="dni"
                       placeholder="dni con letra" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Datos de su estancia</legend>

            <p>
                <label for="personas">Nº de personas:</label>
                <input type="number" id="personas" name="personas"
                       value="2" min="1" max="6">
            </p>

            <p>
                <label for="llegada">Fecha de llegada:</label>
                <input type="date" id="llegada" name="llegada">
            </p>

            <p>
                <label for="salida">Fecha de salida:</label>
                <input type="date" id="salida" name="salida">
            </p>

            <p>
                <label for="habitacion">Tipo Habitación:</label>

                <select id="habitacion" name="habitacion">
                    <option>Individual</option>
                    <option selected>Doble</option>
                    <option>Triple</option>
                </select>
            </p>

            <p>
                <label for="fumador">No fumador:</label>
                <input type="checkbox" id="fumador" name="fumador" checked>
            </p>

            <p>
                Motivo del viaje:

                <input type="radio" name="motivo" value="Trabajo">
                <label>Trabajo</label>

                <input type="radio" name="motivo" value="Ocio" checked>
                <label>Ocio</label>

                <input type="radio" name="motivo" value="Otros">
                <label>Otros</label>
            </p>
        </fieldset>

        <input type="submit" value="Reservar">
        <input type="reset" value="Reiniciar">

    </form>

</body>
</html>
